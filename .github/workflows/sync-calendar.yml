name: Sync Apple Calendar

on:
  schedule:
    - cron: '0 */6 * * *'   # runs every 6 hours
  workflow_dispatch:          # also lets you trigger it manually

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

- name: Download ICS from Apple Calendar
  run: |
    HTTP_CODE=$(curl -L \
      -H "User-Agent: CalendarFetch/1.0" \
      -o data/events.ics \
      -w "%{http_code}" \
      "https://p107-caldav.icloud.com/published/2/MjAwMjg2NzQzMDUyMDAyOIUdIi1NYG67iQ-qZPpE2RAOVKE6-QXI5ymE7vdPjQg9d9Fz-otfDBo7vQgOfGvLZjbhu11ueqEont0UGFHArLQ")
    echo "HTTP status: $HTTP_CODE"
    echo "File size: $(wc -c < data/events.ics) bytes"
    echo "--- File contents ---"
    cat data/events.ics
    if [ ! -s data/events.ics ]; then
      echo "ERROR: Downloaded file is empty — aborting commit"
      exit 1
    fi


      - name: Commit updated ICS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add data/events.ics
          git diff --cached --quiet || git commit -m "Sync calendar"
          git push
