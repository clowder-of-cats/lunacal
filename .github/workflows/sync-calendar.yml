name: Sync Apple Calendar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download ICS from Apple Calendar
        run: |
          curl -L \
            -H "User-Agent: CalendarFetch/1.0" \
            -o data/events.ics \
            "https://p107-caldav.icloud.com/published/2/MjAwMjg2NzQzMDUyMDAyOIUdIi1NYG67iQ-qZPpE2RAOVKE6-QXI5ymE7vdPjQg9d9Fz-otfDBo7vQgOfGvLZjbhu11ueqEont0UGFHArLQ"
          echo "File size: $(wc -c < data/events.ics) bytes"
          cat data/events.ics
          if [ ! -s data/events.ics ]; then
            echo "ERROR: File is empty, aborting"
            exit 1
          fi

      - name: Generate filtered subscribe ICS
        run: |
          python3 - <<'EOF'
          import re

          with open('data/events.ics', 'r', encoding='utf-8') as f:
              content = f.read()

          # Grab everything before the first event (VCALENDAR headers)
          header = content[:content.find('BEGIN:VEVENT')]

          # Extract all VEVENT blocks
          vevents = re.findall(r'BEGIN:VEVENT.*?END:VEVENT', content, re.DOTALL)

          # Keep only open/drop events
          keywords = ['open', 'drop']
          filtered = [
              e for e in vevents
              if (m := re.search(r'SUMMARY:(.*)', e))
              and any(kw in m.group(1).lower() for kw in keywords)
          ]

          output = header + '\n'.join(filtered) + '\nEND:VCALENDAR'

          with open('data/subscribe.ics', 'w', encoding='utf-8') as f:
              f.write(output)

          print(f"Filtered {len(filtered)} of {len(vevents)} events into subscribe.ics")
          EOF

      - name: Commit updated ICS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@github.com"
          git add data/events.ics data/subscribe.ics
          git diff --cached --quiet || git commit -m "Sync calendar"
          git push
