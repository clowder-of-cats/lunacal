<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Coffee — Calendar</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <div class="container">

    <!-- Calendar first -->
    <div id="calendar"></div>

    <!-- Subscribe strip below -->
    <div class="subscribe-strip">
      <span class="subscribe-label">Subscribe to this calendar</span>
      <div class="subscribe-actions">
        <button class="btn" onclick="copyToClipboard()">Copy URL</button>
        <button class="btn" onclick="downloadICS()">Download .ics</button>
      </div>
    </div>

  </div>
  <script src="js/calendar.js"></script>
</body>
</html>
